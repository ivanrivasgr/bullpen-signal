version: 2

models:
  - name: silver_pitch_events
    description: Normalized pitch-level analytical table derived from bronze.pitches.
    columns:
      - name: event_time
        description: Event timestamp used for analytical ordering.
        tests:
          - not_null
      - name: event_day
        description: Calendar day derived from event_time.
        tests:
          - not_null
      - name: game_pk
        description: MLB game identifier.
        tests:
          - not_null
      - name: at_bat_number
        description: Plate appearance sequence within the game.
        tests:
          - not_null
      - name: pitch_number
        description: Pitch sequence within the plate appearance.
        tests:
          - not_null
      - name: inning
        description: Inning number.
        tests:
          - not_null
      - name: inning_topbot
        description: Half-inning marker from the source event.
        tests:
          - not_null
      - name: pitcher_id
        description: MLB player identifier for the pitcher.
        tests:
          - not_null
      - name: batter_id
        description: MLB player identifier for the batter.
        tests:
          - not_null
      - name: is_late_arrival
        description: Replay-engine provenance flag preserved from bronze.
        tests:
          - not_null
      - name: is_duplicate
        description: Replay-engine provenance flag preserved from bronze.
        tests:
          - not_null
      - name: correction_of
        description: Replay-engine correction pointer preserved from bronze.
      - name: ingestion_time
        description: Lakehouse audit timestamp.
        tests:
          - not_null
      - name: kafka_partition
        description: Kafka partition for source reconciliation.
        tests:
          - not_null
      - name: source_offset
        description: Kafka offset scoped to kafka_partition.
        tests:
          - not_null

  - name: silver_pitcher_game_fatigue
    description: Game/pitcher workload snapshot with initial fatigue bucket.
    columns:
      - name: game_pk
        description: MLB game identifier.
        tests:
          - not_null
      - name: pitcher_id
        description: MLB player identifier for the pitcher.
        tests:
          - not_null
      - name: pitch_count
        description: Non-duplicate pitch count for this pitcher in this game.
        tests:
          - not_null
      - name: first_pitch_time
        description: Timestamp of the first non-duplicate pitch thrown by this pitcher in this game.
        tests:
          - not_null
      - name: last_pitch_time
        description: Timestamp of the last non-duplicate pitch thrown by this pitcher in this game.
        tests:
          - not_null
      - name: fatigue_bucket
        description: "Workload bucket per ADR 0008: low (<25), medium (25-49), high (>=50)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high']

  - name: silver_matchup_events
    description: |
      Per-pitch matchup view derived from silver_pitch_events plus pitcher
      fatigue context. Phase 2 Milestone 2. Handedness columns are
      populated on milestone day 2 once the player_handedness seed lands;
      until then they are nullable. See ADR 0016 for the design.
    columns:
      - name: event_time
        tests:
          - not_null
      - name: game_pk
        tests:
          - not_null
      - name: at_bat_number
        tests:
          - not_null
      - name: pitch_number
        tests:
          - not_null
      - name: pitcher_id
        tests:
          - not_null
      - name: batter_id
        tests:
          - not_null
      - name: pitcher_fatigue_bucket
        description: |
          Pitcher fatigue bucket joined from silver_pitcher_game_fatigue
          at the (game_pk, pitcher_id) grain. May be NULL for pitches in
          games where the pitcher has not yet accumulated enough pitches
          to be in the fatigue table.
      - name: pitcher_handedness
        description: |
          'L' or 'R', joined from player_handedness seed where role='pitcher'.
          NULL only for player IDs missing from the seed.
        tests:
          - accepted_values:
              arguments:
                values: ['L', 'R']
              config:
                where: "pitcher_handedness IS NOT NULL"
      - name: batter_handedness
        description: |
          'L' or 'R', joined from player_handedness seed where role='batter'.
          NULL only for player IDs missing from the seed.
        tests:
          - accepted_values:
              arguments:
                values: ['L', 'R']
              config:
                where: "batter_handedness IS NOT NULL"
      - name: handedness_matchup
        description: |
          Concatenated matchup of the form 'R_vs_L' (pitcher_vs_batter).
          NULL whenever either pitcher_handedness or batter_handedness is
          NULL — a partial matchup is not a usable signal.
        tests:
          - accepted_values:
              arguments:
                values: ['R_vs_R', 'R_vs_L', 'L_vs_R', 'L_vs_L']
              config:
                where: "handedness_matchup IS NOT NULL"
