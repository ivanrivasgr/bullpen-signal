version: 2

models:
  - name: silver_pitch_events
    description: Normalized pitch-level analytical table derived from bronze.pitches.
    columns:
      - name: event_time
        description: Event timestamp used for analytical ordering.
        tests:
          - not_null
      - name: event_day
        description: Calendar day derived from event_time.
        tests:
          - not_null
      - name: game_pk
        description: MLB game identifier.
        tests:
          - not_null
      - name: at_bat_number
        description: Plate appearance sequence within the game.
        tests:
          - not_null
      - name: pitch_number
        description: Pitch sequence within the plate appearance.
        tests:
          - not_null
      - name: inning
        description: Inning number.
        tests:
          - not_null
      - name: inning_topbot
        description: Half-inning marker from the source event.
        tests:
          - not_null
      - name: pitcher_id
        description: MLB player identifier for the pitcher.
        tests:
          - not_null
      - name: batter_id
        description: MLB player identifier for the batter.
        tests:
          - not_null
      - name: is_late_arrival
        description: Replay-engine provenance flag preserved from bronze.
        tests:
          - not_null
      - name: is_duplicate
        description: Replay-engine provenance flag preserved from bronze.
        tests:
          - not_null
      - name: correction_of
        description: Replay-engine correction pointer preserved from bronze.
      - name: ingestion_time
        description: Lakehouse audit timestamp.
        tests:
          - not_null
      - name: kafka_partition
        description: Kafka partition for source reconciliation.
        tests:
          - not_null
      - name: source_offset
        description: Kafka offset scoped to kafka_partition.
        tests:
          - not_null

  - name: silver_pitcher_game_fatigue
    description: Game/pitcher workload snapshot with initial fatigue bucket.
    columns:
      - name: game_pk
        description: MLB game identifier.
        tests:
          - not_null
      - name: pitcher_id
        description: MLB player identifier for the pitcher.
        tests:
          - not_null
      - name: pitch_count
        description: Non-duplicate pitch count for this pitcher in this game.
        tests:
          - not_null
      - name: first_pitch_time
        description: Timestamp of the first non-duplicate pitch thrown by this pitcher in this game.
        tests:
          - not_null
      - name: last_pitch_time
        description: Timestamp of the last non-duplicate pitch thrown by this pitcher in this game.
        tests:
          - not_null
      - name: fatigue_bucket
        description: "Workload bucket per ADR 0008: low (<25), medium (25-49), high (>=50)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high']

  - name: silver_matchup_events
    description: |
      Per-pitch matchup view derived from silver_pitch_events plus pitcher
      fatigue context. Phase 2 Milestone 2. Handedness columns are
      populated on milestone day 2 once the player_handedness seed lands;
      until then they are nullable. See ADR 0016 for the design.
    columns:
      - name: event_time
        tests:
          - not_null
      - name: game_pk
        tests:
          - not_null
      - name: at_bat_number
        tests:
          - not_null
      - name: pitch_number
        tests:
          - not_null
      - name: pitcher_id
        tests:
          - not_null
      - name: batter_id
        tests:
          - not_null
      - name: pitcher_fatigue_bucket
        description: |
          Pitcher fatigue bucket joined from silver_pitcher_game_fatigue
          at the (game_pk, pitcher_id) grain. May be NULL for pitches in
          games where the pitcher has not yet accumulated enough pitches
          to be in the fatigue table.
      - name: pitcher_handedness
        description: |
          'L' or 'R', joined from player_handedness seed where role='pitcher'.
          NULL only for player IDs missing from the seed.
        tests:
          - accepted_values:
              arguments:
                values: ['L', 'R', 'S']
              config:
                where: "pitcher_handedness IS NOT NULL"
      - name: batter_handedness
        description: |
          'L' or 'R', joined from player_handedness seed where role='batter'.
          NULL only for player IDs missing from the seed.
        tests:
          - accepted_values:
              arguments:
                values: ['L', 'R', 'S']
              config:
                where: "batter_handedness IS NOT NULL"
      - name: handedness_matchup
        description: |
          Concatenated matchup of the form 'R_vs_L' (pitcher_vs_batter).
          NULL whenever either pitcher_handedness or batter_handedness is
          NULL — a partial matchup is not a usable signal.
        tests:
          - accepted_values:
              arguments:
                values: ['R_vs_R', 'R_vs_L', 'R_vs_S', 'L_vs_R', 'L_vs_L', 'L_vs_S', 'S_vs_R', 'S_vs_L', 'S_vs_S']
              config:
                where: "handedness_matchup IS NOT NULL"

  - name: silver_matchup_signals
    description: |
      Per-pitch matchup signal materialized from silver_matchup_events.
      Three new columns (signal_value, confidence_band,
      lineup_state_at_emission) are produced by the pure function in
      signals/matchup_signal.py. ADR 0016 governs the design. Phase 3
      reads this table as the canonical record of what the system would
      have emitted, for reconciliation against actual outcomes.
    columns:
      - name: event_time
        tests:
          - not_null
      - name: game_pk
        tests:
          - not_null
      - name: at_bat_number
        tests:
          - not_null
      - name: pitch_number
        tests:
          - not_null
      - name: pitcher_id
        tests:
          - not_null
      - name: batter_id
        tests:
          - not_null
      - name: signal_value
        description: |
          Matchup edge in the pitcher's direction. Positive favors pitcher;
          negative favors batter. Calibrated from the 2024 season via the
          delta method (ADR 0027). Null when the batter projected under
          lineup uncertainty is irresolvable (absent from the handedness
          seed): "could not compute" is the absence of a value, not a
          fabricated 0.0 (ADR 0028). No not_null test -- the projected batter
          that drove the value is not persisted, so no column distinguishes
          these rows from a resolved emission; a targeted test needs that
          column first (projected_batter_id debt).
      - name: confidence_band
        description: |
          One of full / reduced / suppressed, mapped from lineup_state per
          ADR 0016.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['full', 'reduced', 'suppressed']
      - name: lineup_state_at_emission
        description: |
          The lineup_state that drove the confidence_band. Carried
          explicitly so Phase 3 can filter without re-joining.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['confirmed', 'uncertain', 'projected']
