version: 2

seeds:
  - name: player_handedness
    description: |
      Static handedness lookup per player and role. Pitchers and batters
      get separate rows so two-way players (e.g., Shohei Ohtani) can have
      different throwing and batting hands. Generated by
      infra/data_prep/build_player_handedness.py from the 2024 full-season
      Statcast parquets in data/raw/season_2024/. Regenerate when those
      parquets change. See ADR 0016.
    columns:
      - name: player_id
        description: MLB player ID, joinable to silver_matchup_events.pitcher_id and batter_id.
        tests:
          - not_null
      - name: role
        description: Either 'pitcher' or 'batter'. Disambiguates two-way players.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pitcher', 'batter']
      - name: hand
        description: "L (left), R (right), or S (switch-hitter, observed on both sides). Statcast convention extended."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['L', 'R', 'S']
